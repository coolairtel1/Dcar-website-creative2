# Builds the static site on every push to main and publishes ./out to the `hostinger` branch.
# Hostinger's Git deployment pulls that branch into public_html (auto-deploy via webhook).
name: Build & publish for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish ./out to the hostinger branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./out
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
